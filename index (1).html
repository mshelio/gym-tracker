<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAEC; --surface:#FFFFFF; --sunk:#F2F4F5; --ink:#1B2228; --muted:#5B6770; --line:#CBD2D7;
  --pull:#1D5BB8; --push:#C2252D; --legs:#D9A300; --other:#2E7D4F; --legs-ink:#2A2100; --ok:#23784A; --focus:#1D5BB8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181C; --surface:#1E2429; --sunk:#192025; --ink:#E6EAED; --muted:#99A5AE; --line:#323B42;
    --pull:#5E95EA; --push:#E8585F; --legs:#F0C232; --other:#4FB77C; --legs-ink:#231B00; --ok:#4FBF80; --focus:#7EAAF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181C; --surface:#1E2429; --sunk:#192025; --ink:#E6EAED; --muted:#99A5AE; --line:#323B42;
  --pull:#5E95EA; --push:#E8585F; --legs:#F0C232; --other:#4FB77C; --legs-ink:#231B00; --ok:#4FBF80; --focus:#7EAAF0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1}
.status{font-size:13px;color:var(--muted);text-align:right}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;border-bottom:2px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 4px 9px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Plate selector: the one bold element */
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.plate{position:relative;border:0;border-radius:999px;aspect-ratio:1/1;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);box-shadow:inset 0 0 0 6px rgba(255,255,255,.14),inset 0 0 0 7px rgba(0,0,0,.18);transition:transform .15s ease}
.plate::after{content:"";position:absolute;width:16%;aspect-ratio:1/1;border-radius:50%;background:var(--bg);top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.plate .pn{font-size:clamp(17px,5vw,24px);font-weight:700;line-height:1;transform:translateY(-62%)}
.plate .pt{font-size:12px;font-weight:600;opacity:.9;transform:translateY(160%)}
.plate.pull{background:var(--pull)} .plate.push{background:var(--push)} .plate.legs{background:var(--legs);color:var(--legs-ink)} .plate.other{background:var(--other)}
.plate.new{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;opacity:1;transform:none}
.plate.new::after{display:none}.plate.new .pn{transform:none;font-size:18px}.plate.new .pt{transform:none}
.plate[aria-pressed="false"]{opacity:.38;transform:scale(.9)}
.plate[aria-pressed="true"]{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.plate{transition:none}}
.dayline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 4px;flex-wrap:wrap}
.dayline h2{font-family:var(--display);font-size:34px;font-weight:700;margin:0;line-height:1}
.dayline label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
input[type=date],input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
textarea{width:100%;min-height:80px;resize:vertical}

.ex{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:6px 10px 10px 6px;padding:14px;margin-top:12px}
.ex.pull{border-left-color:var(--pull)} .ex.push{border-left-color:var(--push)} .ex.legs{border-left-color:var(--legs)} .ex.other{border-left-color:var(--other)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head select{font-weight:600;flex:1;min-width:0;max-width:100%}
.target{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap;padding-top:6px}
.last{font-size:14px;color:var(--muted);margin:8px 0 0}
.hint{font-size:14px;margin:4px 0 0;color:var(--ok);font-weight:600}
.sets{margin-top:10px;display:grid;gap:8px}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center}
.setrow span{font-family:var(--display);font-weight:600;color:var(--muted);font-size:17px}
.setrow input{width:100%;text-align:center;font-size:18px}
.setrow input::placeholder{color:var(--muted);opacity:.6}
.colhead{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.row-actions{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%;font-family:var(--display);font-size:22px;padding:12px}
.btn.danger{color:var(--push)}
.btn.small{padding:6px 10px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section{margin-top:22px}
.section h3{font-family:var(--display);font-size:24px;margin:0 0 8px}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);margin-top:16px}

details.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:10px}
details.hist summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details.hist summary::-webkit-details-marker{display:none}
.chip{font-family:var(--display);font-weight:700;font-size:15px;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.chip.pull{background:var(--pull)} .chip.push{background:var(--push)} .chip.legs{background:var(--legs);color:var(--legs-ink)} .chip.other{background:var(--other)}
.ex-name{flex:1;min-width:0;font-weight:600}
.edrow{display:grid;grid-template-columns:1fr 54px 54px 54px 40px;gap:6px;align-items:center;margin-top:8px}
.edrow input{width:100%;text-align:center;padding:8px 4px}.edrow input:first-child{text-align:left;padding:8px 10px}
.edhead{display:grid;grid-template-columns:1fr 54px 54px 54px 40px;gap:6px;font-size:12px;color:var(--muted);margin-top:12px;text-align:center}.edhead span:first-child{text-align:left}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.colors label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface)}
.colors input{accent-color:var(--ink)}
.swatch{width:14px;height:14px;border-radius:50%;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;vertical-align:middle;margin-left:6px}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);min-height:28px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.colhead .wcell{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px}
.iconbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;min-height:40px;cursor:pointer;font-size:18px;line-height:1}
.hist .meta{font-size:14px;color:var(--muted);text-align:right}
.hist .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.hist table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
.hist td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.hist td:last-child{text-align:right;color:var(--muted)}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.form-row label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.form-row input{width:100%}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.stack{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.setrow,.colhead{grid-template-columns:40px 1fr 1fr}.dayline h2{font-size:28px}}
</style>

<style id="vibrant-theme">
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f0f4fa;
  --text:#182230;
  --muted:#667085;
  --border:#e2e8f0;
  --primary:#6d5dfc;
  --primary-2:#8b5cf6;
  --accent:#06b6d4;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#ef4444;
  --push:#ff5c7a;
  --pull:#5b7cfa;
  --legs:#18b981;
  --shadow:0 10px 30px rgba(31,41,55,.08);
  --shadow-sm:0 4px 14px rgba(31,41,55,.07);
  --radius:18px;
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(circle at 0% 0%,rgba(109,93,252,.10),transparent 28rem),
    radial-gradient(circle at 100% 10%,rgba(6,182,212,.08),transparent 24rem),
    var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
button:active{transform:translateY(1px)}
.btn{
  min-height:44px;
  border:1px solid var(--border);
  border-radius:13px;
  padding:10px 15px;
  background:var(--surface);
  color:var(--text);
  font-weight:700;
  box-shadow:var(--shadow-sm);
}
.btn:hover{border-color:#c7d2fe;box-shadow:0 7px 18px rgba(31,41,55,.10)}
.btn.primary{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 8px 20px rgba(109,93,252,.25);
}
.btn.primary:hover{box-shadow:0 11px 26px rgba(109,93,252,.32)}
.section,.card,.panel,.modal,.sheet{
  border-color:var(--border)!important;
  box-shadow:var(--shadow)!important;
}
input,select,textarea{
  border:1px solid var(--border)!important;
  background:var(--surface)!important;
  color:var(--text)!important;
  border-radius:12px!important;
  min-height:42px;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#8b7cf6!important;
  box-shadow:0 0 0 4px rgba(109,93,252,.12)!important;
}
textarea{min-height:120px}

header,.topbar,.app-header{
  background:rgba(255,255,255,.88)!important;
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(226,232,240,.85)!important;
}
nav,.tabs{
  gap:7px!important;
  background:var(--surface-2)!important;
  padding:6px!important;
  border-radius:15px!important;
}
nav button,.tabs button{
  border:0!important;
  border-radius:11px!important;
  min-height:42px;
  font-weight:750;
}
nav button.active,.tabs button.active{
  color:#fff!important;
  background:linear-gradient(135deg,var(--primary),var(--primary-2))!important;
  box-shadow:0 5px 14px rgba(109,93,252,.22);
}

h1,h2,h3{letter-spacing:-.025em}
h1{font-weight:850}
h2{font-weight:800}
h3{font-weight:780}
.muted{color:var(--muted)!important}

/* Workout/day selector */
.day-grid,.program-grid{
  gap:12px!important;
}
.day-card,.program-card,[data-day]{
  border:1px solid var(--border)!important;
  border-radius:16px!important;
  background:var(--surface)!important;
  box-shadow:var(--shadow-sm)!important;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.day-card:hover,.program-card:hover,[data-day]:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow)!important;
}
.day-card.active,.program-card.active,[data-day].active{
  border-color:rgba(109,93,252,.55)!important;
  box-shadow:0 0 0 3px rgba(109,93,252,.10),var(--shadow)!important;
}

/* Color-code PPL sections without changing their data */
[class*="push"] .badge,[class*="push"] .tag{background:rgba(255,92,122,.12);color:#db3153}
[class*="pull"] .badge,[class*="pull"] .tag{background:rgba(91,124,250,.12);color:#3e5bd1}
[class*="legs"] .badge,[class*="legs"] .tag{background:rgba(24,185,129,.12);color:#07865d}

/* Exercise cards */
.exercise,.exercise-card,.set-row{
  background:var(--surface)!important;
  border-color:var(--border)!important;
}
.exercise-card,.exercise{
  border-radius:16px!important;
  box-shadow:var(--shadow-sm);
}
.set-row{
  border-radius:12px!important;
}
.set-row input{font-weight:700}
.set-row.completed,.set-row.done{
  background:rgba(22,163,74,.055)!important;
  border-color:rgba(22,163,74,.22)!important;
}
.badge,.tag,.pill{
  border-radius:999px!important;
  padding:5px 10px!important;
  font-weight:750!important;
}

/* Dashboard/stat cards */
.stat,.stat-card,.metric,.progress-card{
  background:linear-gradient(145deg,#fff,#f8faff)!important;
  border:1px solid var(--border)!important;
  border-radius:16px!important;
  box-shadow:var(--shadow-sm)!important;
}
.stat-value,.metric-value{
  font-weight:850!important;
  letter-spacing:-.04em;
}

/* Progress bars */
.progress-bar,.bar{
  background:#e9eef7!important;
  border-radius:999px!important;
  overflow:hidden;
}
.progress-bar>*,.bar>*{
  border-radius:999px!important;
  background:linear-gradient(90deg,var(--primary),var(--accent))!important;
}

/* Toast/status */
.toast{
  border:0!important;
  background:#182230!important;
  color:#fff!important;
  border-radius:13px!important;
  box-shadow:0 12px 30px rgba(15,23,42,.22)!important;
}

/* Floating primary actions */
.fab,.floating-action{
  background:linear-gradient(135deg,var(--primary),var(--accent))!important;
  color:#fff!important;
  border:0!important;
  box-shadow:0 12px 26px rgba(79,70,229,.28)!important;
}

/* Tables/history */
table{border-collapse:separate!important;border-spacing:0 7px!important}
thead th{
  color:var(--muted)!important;
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.06em;
}
tbody tr{background:var(--surface)!important;box-shadow:var(--shadow-sm)}
tbody td{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
tbody td:first-child{border-left:1px solid var(--border);border-radius:12px 0 0 12px}
tbody td:last-child{border-right:1px solid var(--border);border-radius:0 12px 12px 0}

/* Mobile usability */
@media(max-width:700px){
  body{font-size:15px}
  .section,.card,.panel,.exercise-card,.exercise{border-radius:15px!important}
  .btn{width:100%;min-height:46px}
  nav button,.tabs button{min-height:44px}
  input,select{min-height:46px}
  .stack>.btn + .btn{margin-top:2px}
}
</style>


<style id="vibrant-header">
.app-title,.brand,.logo{
  font-weight:900!important;
  background:linear-gradient(90deg,#6d5dfc,#06b6d4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent!important;
}
</style>

<meta name="description" content="PPL workout tracker with automatic browser saving and JSON backup.">
<meta name="theme-color" content="#6d5dfc">

<body>
<div class="wrap">

    <div class="brand">

</div>
<div class="toast" id="toast" role="status"></div>

<script>

const PROGRAM = [

  {id:"pushB",name:"Push B",type:"push",ex:[

    {n:"Overhead triceps extension",s:3,lo:10,hi:12,alt:["EZ-bar skull crusher","Single-arm cable overhead extension"]}]},
  {id:"legsB",name:"Legs B",type:"legs",ex:[
    {n:"Romanian deadlift",s:3,lo:8,hi:10,alt:["Dumbbell RDL","45° back extension"]},
    {n:"Bulgarian split squat",s:3,lo:8,hi:10,alt:["Walking lunge","Reverse lunge"]},
    {n:"Hip thrust",s:3,lo:10,hi:12,alt:["Glute bridge","Machine hip thrust"]},
    {n:"Seated leg curl",s:3,lo:10,hi:12,alt:["Lying leg curl","Stability ball leg curl"]},
    {n:"Seated calf raise",s:3,lo:12,hi:15,alt:["Leg press calf raise","Standing calf raise"]},
    {n:"Cable crunch",s:3,lo:12,hi:15,alt:["Machine crunch","Decline crunch"]}]}
];
const BASE_DAY = Object.fromEntries(PROGRAM.map(d => [d.id, d]));
const TYPES = [["pull","Pull"],["push","Push"],["legs","Legs"],["other","Other"]];
const DEFAULT_UNIT = "lb";
const KG_PER_LB = 0.45359237;
const conv = (w, from, to) => { const n = num(w); if (n == null) return null; if (from === to) return n; return to === "kg" ? n * KG_PER_LB : n / KG_PER_LB; };
const tidy = (n, unit) => n == null ? "" : (unit === "kg" ? Math.round(n*2)/2 : Math.round(n));
const exUnit = (e, s) => e.unit || (s && s.unit) || DEFAULT_UNIT;
const ORDER = PROGRAM.map(d => d.id);
const LOCAL_KEY = "ppl-tracker-v1";
const DRAFT_KEY = "ppl-tracker-drafts-v1";

const S = { tab:"log", sessions:[], body:[], custom:[], editing:null, dayId:null, drafts:{}, progressEx:null, mode:"pending", armedDelete:null, ready:false };

function allDays(){ return [...PROGRAM, ...S.custom]; }
function getDay(id){ return BASE_DAY[id] || S.custom.find(c => c.id === id) || null; }
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtDate = iso => { try { return new Date(iso + "T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); } catch { return iso; } };
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + r/30) : 0;
const round1 = n => Math.round(n*10)/10;
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }
const sortSessions = arr => arr.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const sortBody = arr => arr.slice().sort((a,b) => (a.date||"").localeCompare(b.date||""));

/* ---------- storage ---------- */
let sessionsCol = null, bodyCol = null, profileDoc = null;
let jsonFileHandle = null;
let jsonFileName = "ppl-tracker-data.json";
function readLocal(){ try { const j = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); return { sessions: Array.isArray(j.sessions)?j.sessions:[], body: Array.isArray(j.body)?j.body:[], custom: Array.isArray(j.custom)?j.custom:[] }; } catch { return {sessions:[],body:[],custom:[]}; } }
function writeLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify({sessions:S.sessions, body:S.body, custom:S.custom})); return true; } catch { return false; } }
function storagePayload(){ return { app:"ppl-tracker", version:1, updatedAt:new Date().toISOString(), sessions:S.sessions, body:S.body, custom:S.custom }; }
function applyPayload(j){ S.sessions = sortSessions(Array.isArray(j.sessions)?j.sessions:[]); S.body = sortBody(Array.isArray(j.body)?j.body:[]); S.custom = Array.isArray(j.custom)?j.custom:[]; }

function saveGitHubPagesData(){
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify({
      app:"ppl-tracker",
      version:1,
      updatedAt:new Date().toISOString(),
      sessions:S.sessions,
      body:S.body,
      custom:S.custom
    }));
    return true;
  } catch { return false; }
}

function loadDrafts(){ try { S.drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}") || {}; } catch { S.drafts = {}; } }
let draftTimer;
function saveDrafts(){ clearTimeout(draftTimer); draftTimer = setTimeout(()=>{ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(S.drafts)); } catch {} }, 400); }

async function initStore(){
  S.mode = "local";
  const l = readLocal();
  S.sessions = sortSessions(l.sessions);
  S.body = sortBody(l.body);
  S.custom = l.custom;
  S.ready = true;
  setStatus("Saved automatically on this device");
  afterLoad();
}
function setStatus(t){ $("#status").textContent = t; }
let firstLoad = true;
function afterLoad(){
  if (firstLoad && S.ready) { firstLoad = false; S.dayId = nextDayId(); }
  render();
}

async function persistJsonOrLocal(){
  if (!saveGitHubPagesData()) throw new Error("storage");
}
async function putSession(s){ S.sessions = sortSessions([s, ...S.sessions.filter(x => x.id !== s.id)]); await persistJsonOrLocal(); }
async function removeSession(id){ S.sessions = S.sessions.filter(x => x.id !== id); await persistJsonOrLocal(); }
async function putBody(b){ S.body = sortBody([b, ...S.body.filter(x => x.id !== b.id)]); await persistJsonOrLocal(); }
async function removeBody(id){ S.body = S.body.filter(x => x.id !== id); await persistJsonOrLocal(); }
async function putCustom(list){ S.custom = list; await persistJsonOrLocal(); }
/* ---------- logic ---------- */
function nextDayId(){
  const last = S.sessions.find(s => ORDER.includes(s.dayId));
  if (!last) return ORDER[0];
  return ORDER[(ORDER.indexOf(last.dayId) + 1) % ORDER.length];
}
function getDraft(dayId){
  let d = S.drafts[dayId];
  const day = getDay(dayId);
  const sig = day.ex.map(e => e.n).join("|");
  if (!d || !Array.isArray(d.ex) || d.sig !== sig || d.ex.length !== day.ex.length) {
    d = { sig, date: today(), notes:"", extra:[], ex: day.ex.map(e => ({ name:e.n, sets: Array.from({length:e.s}, () => ({w:"",r:""})) })) };
    S.drafts[dayId] = d;
  }
  if (!Array.isArray(d.extra)) d.extra = [];
  d.ex.forEach(e => { if (!e.unit) e.unit = unitFor(e.name, day); });
  d.extra.forEach(e => { if (!e.unit) e.unit = day.unit || DEFAULT_UNIT; });
  return d;
}
function lastFor(name){
  for (const s of S.sessions) { const e = (s.exercises||[]).find(x => x.name === name); if (e && e.sets && e.sets.length) return { date:s.date, sets:e.sets, unit: exUnit(e, s) }; }
  return null;
}
function unitFor(name, day){ const l = name ? lastFor(name) : null; return l ? l.unit : ((day && day.unit) || DEFAULT_UNIT); }
function unitSeg(g, i, u){ return `<span class="seg" role="group" aria-label="Weight unit">${["kg","lb"].map(x => `<button type="button" data-act="unit" data-g="${g}" data-i="${i}" data-u="${x}" aria-pressed="${u===x}">${x}</button>`).join("")}</span>`; }
function draftHasData(d){ return [...d.ex, ...(d.extra||[])].some(e => e.sets.some(s => String(s.w).trim() !== "" || String(s.r).trim() !== "")) || (d.notes||"").trim() !== ""; }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const active = document.activeElement, key = active && active.dataset ? active.dataset.key : null;
  const selStart = key && "selectionStart" in active ? active.selectionStart : null;
  const app = $("#app");
  if (!S.ready) { app.innerHTML = `<div class="empty">Loading your log…</div>`; return; }
  app.innerHTML = S.tab === "log" ? viewLog() : S.tab === "history" ? viewHistory() : S.tab === "progress" ? viewProgress() : viewData();
  if (key) { const el = app.querySelector(`[data-key="${CSS.escape(key)}"]`); if (el) { el.focus({preventScroll:true}); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
}

function setRows(i, prefix, name, sets, last, lo, hi, unit){
  return sets.map((s, j) => {
    const ph = last && last.sets[j] ? { w: tidy(conv(last.sets[j].w ?? 0, last.unit, unit), unit), r: last.sets[j].r } : null;
    return `<div class="setrow"><span>Set ${j+1}</span>
      <input type="number" inputmode="decimal" step="any" min="0" aria-label="${esc(name)} set ${j+1} weight in ${unit === "kg" ? "kilograms" : "pounds"}" data-f="w" data-g="${prefix}" data-i="${i}" data-j="${j}" data-key="${prefix}w-${i}-${j}" value="${esc(s.w)}" placeholder="${ph ? esc(ph.w) : unit}">
      <input type="number" inputmode="numeric" step="1" min="0" aria-label="${esc(name)} set ${j+1} reps" data-f="r" data-g="${prefix}" data-i="${i}" data-j="${j}" data-key="${prefix}r-${i}-${j}" value="${esc(s.r)}" placeholder="${ph ? esc(ph.r ?? "") : (lo ? lo+"–"+hi : "reps")}">
    </div>`; }).join("");
}
function lastBlock(name, e, unit){
  const last = lastFor(name);
  if (!last || !name) return { last:null, html:`<p class="last">No history yet for this exercise. Start light and focus on form.</p>` };
  let html = `<p class="last">Last time (${esc(fmtDate(last.date))}): ${last.sets.map(s => `${esc(s.w ?? 0)}&thinsp;${last.unit} × ${esc(s.r)}`).join(", ")}${last.unit !== unit ? ` <span>(grey targets converted to ${unit})</span>` : ""}</p>`;
  if (e) {
    const allTop = last.sets.length >= e.s && last.sets.every(s => (num(s.r)||0) >= e.hi);
    html += allTop ? `<p class="hint">Every set hit ${e.hi} reps. Add ${unit === "kg" ? "2.5 kg" : "5 lb"} today, or the smallest jump available.</p>` : `<p class="hint">Aim to beat it by one rep on any set.</p>`;
  }
  return { last, html };
}

function viewLog(){
  if (S.editing) return viewEditor();
  const next = nextDayId();
  const day = getDay(S.dayId) || getDay(next);
  S.dayId = day.id;
  const d = getDraft(day.id);
  const isCustom = !BASE_DAY[day.id];
  const plates = allDays().map(p => `
    <button class="plate ${esc(p.type)}" data-act="day" data-id="${esc(p.id)}" aria-pressed="${p.id===day.id}">
      <span class="pn">${esc(p.name)}</span><span class="pt">${p.id===next ? "Next up" : (S.drafts[p.id] && draftHasData(S.drafts[p.id]) ? "In progress" : (BASE_DAY[p.id] ? "" : "Custom"))}</span>
    </button>`).join("") + `<button class="plate new" data-act="newworkout"><span class="pn">+ New</span><span class="pt">Custom workout</span></button>`;
  const cards = day.ex.map((e, i) => {
    const de = d.ex[i];
    const opts = [e.n, ...(e.alt||[])].map(o => `<option ${o===de.name?"selected":""}>${esc(o)}</option>`).join("");
    const lb = lastBlock(de.name, e, de.unit);
    const head = (e.alt && e.alt.length) ? `<select aria-label="Exercise or alternative" data-act="variant" data-i="${i}">${opts}</select>` : `<span class="ex-name" style="padding-top:6px">${esc(de.name)}</span>`;
    return `<section class="ex ${esc(day.type)}">
      <div class="ex-head">${head}<span class="target">${e.s} × ${e.lo}–${e.hi}</span></div>
      ${lb.html}
      <div class="colhead"><span></span><span class="wcell">Weight ${unitSeg("", i, de.unit)}</span><span>Reps</span></div>
      <div class="sets">${setRows(i, "", de.name, de.sets, lb.last, e.lo, e.hi, de.unit)}</div>
      <div class="row-actions"><button class="btn small" data-act="addset" data-i="${i}">Add set</button>${de.sets.length>1?`<button class="btn small" data-act="rmset" data-i="${i}">Remove last set</button>`:""}</div>
    </section>`;
  }).join("");
  const extras = d.extra.map((x, i) => {
    const lb = lastBlock(x.name.trim(), null, x.unit);
    return `<section class="ex other">
      <div class="ex-head"><input type="text" class="ex-name" aria-label="Extra exercise name" placeholder="Exercise name" data-f="xname" data-i="${i}" data-key="xname-${i}" value="${esc(x.name)}"><button class="btn small danger" data-act="rmextra" data-i="${i}">Remove</button></div>
      ${x.name.trim() ? lb.html : ""}
      <div class="colhead"><span></span><span class="wcell">Weight ${unitSeg("x", i, x.unit)}</span><span>Reps</span></div>
      <div class="sets">${setRows(i, "x", x.name, x.sets, lb.last, null, null, x.unit)}</div>
      <div class="row-actions"><button class="btn small" data-act="addset" data-g="x" data-i="${i}">Add set</button>${x.sets.length>1?`<button class="btn small" data-act="rmset" data-g="x" data-i="${i}">Remove last set</button>`:""}</div>
    </section>`;
  }).join("");
  return `
    <div class="plates" role="group" aria-label="Choose workout">${plates}</div>
    <div class="dayline"><div><h2>${esc(day.name)}</h2>${isCustom ? `<button class="btn small" style="margin-top:8px" data-act="editday" data-id="${esc(day.id)}">Edit workout</button>` : ""}</div>
      <label>Date<input type="date" data-f="date" data-key="date" value="${esc(d.date)}"></label></div>
    <p class="muted" style="margin:4px 0 0;font-size:14px">Switch kg or lb on each exercise; it remembers your choice. Grey numbers are last session's. Rest 2–3 min on the first lifts, 60–90 s on the rest.</p>
    ${cards}${extras}
    <div class="row-actions" style="margin-top:12px"><button class="btn" data-act="addextra">Add an extra exercise to this session</button></div>
    <div class="section"><label for="notes"><h3>Notes</h3></label>
      <textarea id="notes" data-f="notes" data-key="notes" placeholder="Sleep, energy, anything that hurt…">${esc(d.notes)}</textarea></div>
    <div class="section"><button class="btn primary" data-act="save">Save session</button></div>`;
}

function viewEditor(){
  const w = S.editing, isNew = !S.custom.some(c => c.id === w.id);
  const colors = TYPES.map(([t,label]) => `<label><input type="radio" name="edtype" data-ed="type" value="${t}" ${w.type===t?"checked":""}><span class="swatch" style="background:var(--${t})"></span>${label}</label>`).join("");
  const rows = w.ex.map((e, i) => `<div class="edrow">
      <input type="text" aria-label="Exercise ${i+1} name" placeholder="Exercise name" data-ef="n" data-i="${i}" data-key="ed-n-${i}" value="${esc(e.n)}">
      <input type="number" inputmode="numeric" min="1" max="10" aria-label="Sets" data-ef="s" data-i="${i}" data-key="ed-s-${i}" value="${esc(e.s)}">
      <input type="number" inputmode="numeric" min="1" max="50" aria-label="Minimum reps" data-ef="lo" data-i="${i}" data-key="ed-lo-${i}" value="${esc(e.lo)}">
      <input type="number" inputmode="numeric" min="1" max="50" aria-label="Maximum reps" data-ef="hi" data-i="${i}" data-key="ed-hi-${i}" value="${esc(e.hi)}">
      <button class="iconbtn" data-act="edrmex" data-i="${i}" aria-label="Remove exercise ${i+1}">×</button>
    </div>`).join("");
  return `<div class="section">
    <h3>${isNew ? "New workout" : "Edit workout"}</h3>
    <label class="muted" style="font-size:14px;display:block">Name
      <input type="text" style="width:100%;margin-top:3px" data-ed="name" data-key="ed-name" placeholder="e.g. Arms + abs, Upper body, Home workout" value="${esc(w.name)}"></label>
    <p class="muted" style="font-size:14px;margin:12px 0 0">Plate color</p>
    <div class="colors" role="radiogroup" aria-label="Plate color">${colors}</div>
    <p class="muted" style="font-size:14px;margin:12px 0 0">Default weight unit</p>
    <div class="colors" role="radiogroup" aria-label="Default weight unit">${["lb","kg"].map(u => `<label><input type="radio" name="edunit" data-ed="unit" value="${u}" ${(w.unit||DEFAULT_UNIT)===u?"checked":""}>${u}</label>`).join("")}</div>
    <div class="edhead"><span>Exercise</span><span>Sets</span><span>Min reps</span><span>Max reps</span><span></span></div>
    ${rows}
    <div class="row-actions"><button class="btn small" data-act="edaddex">Add exercise</button></div>
    <p class="muted" style="font-size:13px">Custom workouts sit outside the push/pull/legs rotation, so they won't change which day is marked next up.</p>
    <div class="stack" style="margin-top:14px">
      <button class="btn primary" data-act="edsave">Save workout</button>
      <button class="btn" data-act="edcancel">Cancel</button>
      ${isNew ? "" : `<button class="btn danger" data-act="eddelete">${S.armedDelete===w.id ? "Tap again to delete this workout" : "Delete workout"}</button>`}
    </div></div>`;
}

function viewHistory(){
  if (!S.sessions.length) return `<div class="empty">No sessions yet. Log your first workout and it will show up here.</div>`;
  return `<div class="section">` + S.sessions.map(s => {
    const gd = getDay(s.dayId); const day = { name: s.dayName || (gd && gd.name) || "Workout", type: (gd && gd.type) || s.type || "other" };
    const sets = (s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0);
    const units = [...new Set((s.exercises||[]).map(e => exUnit(e, s)))];
    const vu = units.length === 1 ? units[0] : "lb";
    const vol = Math.round((s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,x)=>b+(conv(x.w||0, exUnit(e,s), vu)||0)*(num(x.r)||0),0),0));
    const rows = (s.exercises||[]).map(e => `<tr><td>${esc(e.name)}</td><td>${(e.sets||[]).map(x=>`${esc(x.w ?? 0)}×${esc(x.r)}`).join(", ")} ${exUnit(e,s)}</td></tr>`).join("");
    const armed = S.armedDelete === s.id;
    return `<details class="hist"><summary><span class="chip ${esc(day.type)}">${esc(day.name)}</span><span>${esc(fmtDate(s.date))}</span><span class="meta">${sets} sets<br>${vol.toLocaleString()} ${vu}</span></summary>
      <div class="body"><table><tbody>${rows}</tbody></table>
      ${s.notes ? `<p class="muted">${esc(s.notes)}</p>` : ""}
      <div class="row-actions"><button class="btn small danger" data-act="delsession" data-id="${esc(s.id)}">${armed ? "Tap again to delete" : "Delete session"}</button></div></div></details>`;
  }).join("") + `</div>`;
}

function chartSVG(points, color, unit){
  if (points.length < 2) return `<div class="empty" style="margin-top:10px">Log this at least twice to see a trend line.</div>`;
  const W=600,H=230,P={l:44,r:14,t:16,b:30};
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const x0=Math.min(...xs), x1=Math.max(...xs); let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=(y1-y0)*0.12 || 2; y0-=pad; y1+=pad;
  const X=x=>P.l+((x-x0)/((x1-x0)||1))*(W-P.l-P.r), Y=y=>H-P.b-((y-y0)/((y1-y0)||1))*(H-P.t-P.b);
  const path=points.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const dots=points.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="${color}"><title>${new Date(p.x).toLocaleDateString()}: ${round1(p.y)} ${unit}</title></circle>`).join("");
  const grid=[0,0.5,1].map(t=>{const v=y0+(y1-y0)*t;const y=Y(v);return `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(v)}</text>`;}).join("");
  const d0=new Date(x0).toLocaleDateString(undefined,{day:"numeric",month:"short"}), d1=new Date(x1).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${P.l}" y="${H-8}" font-size="12" fill="var(--muted)">${d0}</text><text x="${W-P.r}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--muted)">${d1}</text></svg></div>`;
}

function viewProgress(){
  const names = [...new Set(S.sessions.flatMap(s => (s.exercises||[]).map(e => e.name)))].sort();
  let exHtml;
  if (!names.length) exHtml = `<div class="empty">Your strength trends appear here once you've logged a session.</div>`;
  else {
    if (!names.includes(S.progressEx)) S.progressEx = names[0];
    const pts = [], dayType = (()=>{ for (const d of allDays()) if (d.ex.some(e=>e.n===S.progressEx||(e.alt||[]).includes(S.progressEx))) return d.type; return "other"; })();
    let best=0, heaviest=0;
    const pu = (lastFor(S.progressEx) || {}).unit || DEFAULT_UNIT;
    sortSessions(S.sessions).reverse().forEach(s => { const e=(s.exercises||[]).find(x=>x.name===S.progressEx); if(!e) return;
      const eu = exUnit(e, s);
      let top=0; e.sets.forEach(x=>{const w=conv(x.w||0, eu, pu)||0,r=num(x.r)||0; top=Math.max(top,e1rm(w,r)); heaviest=Math.max(heaviest,w);});
      if (top>0){ pts.push({x:new Date(s.date+"T12:00:00").getTime(), y:top}); best=Math.max(best,top);} });
    const first = pts[0] ? pts[0].y : 0, last = pts.length ? pts[pts.length-1].y : 0;
    const change = first ? Math.round(((last-first)/first)*100) : 0;
    exHtml = `<select aria-label="Exercise" data-act="progressEx" style="width:100%">${names.map(n=>`<option ${n===S.progressEx?"selected":""}>${esc(n)}</option>`).join("")}</select>
      <div class="stats"><div class="stat"><b>${round1(best)}</b><small>Best est. 1RM (${pu})</small></div>
      <div class="stat"><b>${round1(heaviest)}</b><small>Heaviest set (${pu})</small></div>
      <div class="stat"><b>${change>0?"+":""}${change}%</b><small>Since first log</small></div></div>
      ${chartSVG(pts, `var(--${dayType})`, pu + " est. 1RM")}
      <p class="muted" style="font-size:13px">Estimated 1RM uses the Epley formula on your best set each session, so heavier weights and extra reps both count as progress. Sessions logged in a different unit are converted.</p>`;
  }
  const bu = S.body.length ? (S.body[S.body.length-1].unit || DEFAULT_UNIT) : (S.bodyUnit || "kg");
  const bpts = S.body.filter(b=>num(b.weight)).map(b=>({x:new Date(b.date+"T12:00:00").getTime(), y:conv(b.weight, b.unit||DEFAULT_UNIT, bu)}));
  const wpts = S.body.filter(b=>num(b.waist)).map(b=>({x:new Date(b.date+"T12:00:00").getTime(), y:num(b.waist)}));
  const recent = S.body.slice().reverse().slice(0,8).map(b => `<li><span>${esc(fmtDate(b.date))}</span><span>${b.weight?esc(b.weight)+" "+(b.unit||DEFAULT_UNIT):""}${b.weight&&b.waist?" · ":""}${b.waist?esc(b.waist)+" cm waist":""}</span>
    <button class="btn small danger" data-act="delbody" data-id="${esc(b.id)}">${S.armedDelete===b.id?"Tap again":"Delete"}</button></li>`).join("");
  return `<div class="section"><h3>Lifts</h3>${exHtml}</div>
    <div class="section"><h3>Body</h3>
      <div class="form-row">
        <label>Date<input type="date" id="bDate" value="${today()}"></label>
        <label><span>Weight <select id="bUnit" aria-label="Body weight unit" style="min-height:28px;padding:2px 6px">${["kg","lb"].map(u=>`<option ${u===(S.bodyUnit||bu)?"selected":""}>${u}</option>`).join("")}</select></span><input type="number" inputmode="decimal" step="any" id="bWeight" placeholder="${(S.bodyUnit||bu)==="kg"?"87":"192"}"></label>
        <label>Waist (cm)<input type="number" inputmode="decimal" step="0.5" id="bWaist" placeholder="optional"></label>
      </div>
      <div class="row-actions"><button class="btn" data-act="addbody">Add entry</button></div>
      <p class="muted" style="font-size:13px">Weigh in a few mornings a week. The trend matters more than any single day.</p>
      ${bpts.length ? `<p style="margin:12px 0 0;font-weight:600">Body weight</p>${chartSVG(bpts,"var(--ink)",bu)}` : ""}
      ${wpts.length ? `<p style="margin:12px 0 0;font-weight:600">Waist</p>${chartSVG(wpts,"var(--muted)","cm")}` : ""}
      ${recent ? `<ul class="list">${recent}</ul>` : `<div class="empty">No body entries yet.</div>`}
    </div>`;
}

function viewData(){
  return `<div class="section stack">
    <h3>Storage</h3>
    <p class="muted" style="margin:0">
      This GitHub Pages version saves your workouts automatically in this browser.
      Your data stays on this device and is not uploaded to GitHub.
    </p>
    <div class="grid2">
      <div class="stat-card">
        <strong>${S.sessions.length}</strong>
        <span class="muted">Workouts</span>
      </div>
      <div class="stat-card">
        <strong>${S.body.length}</strong>
        <span class="muted">Body entries</span>
      </div>
    </div>
    <button class="btn primary" data-act="export">Download JSON backup</button>
  </div>
  <div class="section stack">
    <h3>Restore / transfer</h3>
    <p class="muted" style="margin:0">
      Use a JSON backup to move your data to another phone, browser, or computer.
      Importing does not require GitHub or a server.
    </p>
    <input type="file" id="importFile" accept="application/json,.json" aria-label="Choose JSON backup">
    <textarea id="importText" placeholder='Or paste your JSON backup here…' aria-label="Paste JSON"></textarea>
    <button class="btn" data-act="import">Import JSON backup</button>
  </div>
  <div class="section stack">
    <h3>GitHub Pages note</h3>
    <p class="muted" style="margin:0">
      GitHub Pages hosts the app itself as a static website. It cannot write workout
      changes back into the repository, so the app uses browser storage for automatic
      saving and JSON files for backup/transfer.
    </p>
  </div>`;
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  S.tab = b.dataset.tab; S.armedDelete = null; render(); window.scrollTo({top:0});
});

$("#app").addEventListener("input", e => {
  const t = e.target;
  if (S.tab === "log" && S.editing) {
    if (t.dataset.ed === "name") S.editing.name = t.value;
    else if (t.dataset.ed === "type") S.editing.type = t.value;
    else if (t.dataset.ed === "unit") S.editing.unit = t.value;
    else if (t.dataset.ef) S.editing.ex[+t.dataset.i][t.dataset.ef] = t.value;
    return;
  }
  const f = t.dataset.f; if (!f || S.tab !== "log") return;
  const d = getDraft(S.dayId);
  if (f === "w" || f === "r") (t.dataset.g === "x" ? d.extra : d.ex)[+t.dataset.i].sets[+t.dataset.j][f] = t.value;
  else if (f === "xname") d.extra[+t.dataset.i].name = t.value;
  else if (f === "notes") d.notes = t.value;
  else if (f === "date") d.date = t.value;
  saveDrafts();
});

$("#app").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ed === "type" && S.editing) { S.editing.type = t.value; return; }
  if (t.dataset.act === "variant") { const de = getDraft(S.dayId).ex[+t.dataset.i]; de.name = t.value; de.unit = unitFor(t.value, getDay(S.dayId)); saveDrafts(); render(); }
  if (t.id === "bUnit") { S.bodyUnit = t.value; return; }
  if (t.dataset.act === "progressEx") { S.progressEx = t.value; render(); }
  if (t.id === "importFile" && t.files && t.files[0]) { t.files[0].text().then(txt => { $("#importText").value = txt; toast("File loaded. Tap Import JSON."); }); }
});

$("#app").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const act = b.dataset.act;
  if (act === "day") { S.dayId = b.dataset.id; render(); return; }
  const grp = () => { const d = getDraft(S.dayId); return (b.dataset.g === "x" ? d.extra : d.ex)[+b.dataset.i]; };
  if (act === "addset") { grp().sets.push({w:"",r:""}); saveDrafts(); render(); return; }
  if (act === "rmset") { const de = grp(); if (de.sets.length>1) de.sets.pop(); saveDrafts(); render(); return; }
  if (act === "unit") { const de = grp(); de.unit = b.dataset.u; saveDrafts(); render(); return; }
  if (act === "addextra") { getDraft(S.dayId).extra.push({ name:"", unit:(getDay(S.dayId).unit||DEFAULT_UNIT), sets:[{w:"",r:""},{w:"",r:""},{w:"",r:""}] }); saveDrafts(); render();
    const el = document.querySelector(`[data-key="xname-${getDraft(S.dayId).extra.length-1}"]`); if (el) el.focus(); return; }
  if (act === "rmextra") { getDraft(S.dayId).extra.splice(+b.dataset.i, 1); saveDrafts(); render(); return; }
  if (act === "newworkout") { S.editing = { id: uid("c"), name:"", type:"other", unit:DEFAULT_UNIT, ex:[{n:"",s:3,lo:8,hi:12}] }; S.armedDelete = null; render(); window.scrollTo({top:0}); return; }
  if (act === "editday") { const c = S.custom.find(x => x.id === b.dataset.id); if (c) { S.editing = JSON.parse(JSON.stringify(c)); S.armedDelete = null; render(); window.scrollTo({top:0}); } return; }
  if (act === "edaddex") { S.editing.ex.push({n:"",s:3,lo:8,hi:12}); render(); const el = document.querySelector(`[data-key="ed-n-${S.editing.ex.length-1}"]`); if (el) el.focus(); return; }
  if (act === "edrmex") { S.editing.ex.splice(+b.dataset.i, 1); if (!S.editing.ex.length) S.editing.ex.push({n:"",s:3,lo:8,hi:12}); render(); return; }
  if (act === "edcancel") { S.editing = null; S.armedDelete = null; render(); return; }
  if (act === "edsave") return saveWorkout(b);
  if (act === "eddelete") {
    const id = S.editing.id;
    if (S.armedDelete !== id) { S.armedDelete = id; b.textContent = "Tap again to delete this workout"; return; }
    try { await putCustom(S.custom.filter(c => c.id !== id)); delete S.drafts[id]; saveDrafts(); S.editing = null; S.armedDelete = null; if (S.dayId === id) S.dayId = nextDayId(); render(); toast("Workout deleted"); }
    catch { toast("Couldn't delete. Try again."); }
    return;
  }
  if (act === "save") return saveSession(b);
  if (act === "delsession" || act === "delbody") {
    const id = b.dataset.id;
    if (S.armedDelete !== id) { S.armedDelete = id; b.textContent = act==="delsession" ? "Tap again to delete" : "Tap again"; return; }
    S.armedDelete = null;
    try { act === "delsession" ? await removeSession(id) : await removeBody(id); toast("Deleted"); } catch { toast("Couldn't delete. Try again."); }
    render(); return;
  }
  if (act === "addbody") return addBody();
  if (act === "export") return exportJSON();
  if (act === "copyexport") { const ta = $("#exportOut"); ta.select(); try { await navigator.clipboard.writeText(ta.value); toast("Copied"); } catch { document.execCommand && document.execCommand("copy"); toast("Copied"); } return; }
  if (act === "import") return importJSON();
});

async function saveSession(btn){
  const day = getDay(S.dayId), d = getDraft(S.dayId);
  const exercises = [...d.ex, ...d.extra.filter(x => x.name.trim())].map(e => ({ name:e.name.trim(), unit: e.unit || DEFAULT_UNIT, sets: e.sets.filter(s => num(s.r) > 0).map(s => ({ w: num(s.w) ?? 0, r: num(s.r) })) })).filter(e => e.sets.length);
  if (!exercises.length) { toast("Enter reps for at least one set first."); return; }
  if (!d.date) { toast("Pick a date for this session."); return; }
  const s = { id: uid("s"), dayId: day.id, dayName: day.name, type: day.type, date: d.date, notes: (d.notes||"").trim(), exercises, createdAt: Date.now() };
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await putSession(s);
    delete S.drafts[day.id]; saveDrafts();
    if (S.mode === "db") S.sessions = sortSessions([s, ...S.sessions.filter(x=>x.id!==s.id)]);
    S.dayId = nextDayId(); S.tab = "history"; render(); window.scrollTo({top:0});
    toast("Session saved");
  } catch { btn.disabled = false; btn.textContent = "Save session"; toast("Couldn't save. Check your connection and try again."); }
}

async function saveWorkout(btn){
  const w = S.editing;
  const name = (w.name||"").trim();
  const ex = w.ex.map(e => {
    const s = Math.min(10, Math.max(1, Math.round(num(e.s) || 3)));
    let lo = Math.min(50, Math.max(1, Math.round(num(e.lo) || 8))), hi = Math.min(50, Math.max(1, Math.round(num(e.hi) || lo)));
    if (lo > hi) [lo, hi] = [hi, lo];
    return { n: (e.n||"").trim().slice(0,80), s, lo, hi, alt: [] };
  }).filter(e => e.n);
  if (!name) { toast("Give the workout a name."); return; }
  if (!ex.length) { toast("Add at least one exercise."); return; }
  const clean = { id: w.id, name: name.slice(0,30), type: TYPES.some(t => t[0]===w.type) ? w.type : "other", unit: w.unit === "kg" ? "kg" : "lb", ex };
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const list = S.custom.some(c => c.id === clean.id) ? S.custom.map(c => c.id === clean.id ? clean : c) : [...S.custom, clean];
    await putCustom(list);
    S.editing = null; S.dayId = clean.id; render(); window.scrollTo({top:0}); toast("Workout saved");
  } catch { btn.disabled = false; btn.textContent = "Save workout"; toast("Couldn't save. Try again."); }
}

async function addBody(){
  const date = $("#bDate").value, weight = num($("#bWeight").value), waist = num($("#bWaist").value), unit = $("#bUnit").value === "lb" ? "lb" : "kg"; S.bodyUnit = unit;
  if (!date || (!weight && !waist)) { toast("Add a weight or waist measurement."); return; }
  const b = { id: "b" + date, date, weight: weight ?? null, waist: waist ?? null, unit, createdAt: Date.now() };
  try { await putBody(b); if (S.mode === "db") S.body = sortBody([b, ...S.body.filter(x=>x.id!==b.id)]); render(); toast("Entry added"); }
  catch { toast("Couldn't save. Try again."); }
}

async function exportJSON(){
  const json = JSON.stringify(storagePayload(), null, 2);
  const filename = `ppl-tracker-${today()}.json`;
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("JSON backup downloaded");
}

async function importJSON(){
  let j;
  try { j = JSON.parse($("#importText").value); } catch { toast("That isn't valid JSON."); return; }
  const sessions = Array.isArray(j.sessions) ? j.sessions : [], body = Array.isArray(j.body) ? j.body : [];
  const okS = sessions.filter(s => s && typeof s.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,190}$/.test(s.id) && typeof s.date === "string" && Array.isArray(s.exercises));
  const okB = body.filter(b => b && typeof b.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,190}$/.test(b.id) && typeof b.date === "string");
  const okC = (Array.isArray(j.custom) ? j.custom : []).filter(c => c && typeof c.id === "string" && typeof c.name === "string" && Array.isArray(c.ex) && !BASE_DAY[c.id]);
  if (!okS.length && !okB.length && !okC.length) { toast("Nothing to import was found in that JSON."); return; }
  let done = 0;
  try {
    if (okC.length) { await putCustom([...S.custom.filter(c => !okC.some(o => o.id === c.id)), ...okC]); done += okC.length; }
    for (const s of okS) { await putSession(s); done++; }
    for (const b of okB) { await putBody(b); done++; }
    if (S.mode !== "db") await persistJsonOrLocal();
    toast(`Imported ${done} entries`); render();
  } catch { toast(`Stopped after ${done} entries. Try importing again.`); render(); }
}

loadDrafts();
render();
initStore();
})();
</script>
</body>
</html>
