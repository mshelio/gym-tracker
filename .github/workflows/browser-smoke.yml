name: Browser smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  browser:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, mobile-webkit, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ contains(matrix.project, 'webkit') && 'webkit' || contains(matrix.project, 'firefox') && 'firefox' || 'chromium' }}
      - run: node tests/version-sw.cjs --check
      # Subsets are chosen by test tags, not titles, so renaming a test cannot silently drop coverage.
      - name: Check tagged subset size
        if: ${{ contains(matrix.project, 'webkit') || matrix.project == 'firefox' }}
        run: |
          if [ "${{ matrix.project }}" = "mobile-webkit" ]; then tag='@mobile-webkit'; min=16; else tag='@cross-engine'; min=7; fi
          count=$(npx playwright test --list --project=${{ matrix.project }} --grep "$tag" | grep -oE 'Total: [0-9]+' | grep -oE '[0-9]+')
          echo "$tag selects ${count:-0} tests (minimum $min)"
          [ "${count:-0}" -ge "$min" ]
      - name: Browser tests (${{ matrix.project }})
        run: |
          if [ "${{ matrix.project }}" = "mobile-webkit" ]; then
            npm run test:browser -- --project=mobile-webkit --grep '@mobile-webkit' --timeout=20000 --workers=1 --retries=1 --reporter=line
          elif [ "${{ matrix.project }}" = "firefox" ] || [ "${{ matrix.project }}" = "webkit" ]; then
            npm run test:browser -- --project=${{ matrix.project }} --grep '@cross-engine' --workers=1 --retries=1 --reporter=line
          else
            npm run test:browser -- --project=${{ matrix.project }} --reporter=line
          fi
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload desktop visual review screenshots
        if: ${{ always() && matrix.project == 'chromium' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-chromium
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  production-smoke:
    name: Production GitHub Pages smoke
    needs: browser
    if: ${{ always() && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/pages-smoke.cjs
