name: Regression tests
on:
  push:
    branches: [main, refactor/gt-01-extract-modules]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tests/schedules.test.cjs
      - name: Regression suite
        run: node tests/schedules.test.cjs
