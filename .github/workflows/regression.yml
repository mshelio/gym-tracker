name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check app modules
        run: for f in js/*.js tests/*.cjs; do node --check "$f" || exit 1; done
      - name: Verify deployed service worker revision
        run: node tests/version-sw.cjs --check
      - name: Test release revision upgrade
        run: node tests/version-sw.test.cjs
      - name: Regression suites
        run: npm run test:regression
      - name: Release readiness consistency
        run: node tests/release-readiness.cjs
